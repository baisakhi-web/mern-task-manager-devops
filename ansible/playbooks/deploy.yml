- name: Deploy MERN Task Manager
  hosts: app
  become: true
  vars:
    app_dir: /opt/mern-task-manager

  tasks:
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy project
      copy:
        src: "../../"
        dest: "{{ app_dir }}/"
        mode: preserve

    - name: Start production containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        files:
          - docker-compose.prod.yml
        state: present
        build: always
